<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111a2b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f9fc" media="(prefers-color-scheme: light)">
<title>年轻创业者行动指南</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23111a2b'/%3E%3Crect x='7' y='7' width='86' height='86' rx='14' fill='none' stroke='%2322d3ee' stroke-width='4'/%3E%3Ctext x='50' y='68' font-size='46' text-anchor='middle' fill='%2322d3ee' font-family='monospace'%3E创%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/nav.js"></script>
<script src="assets/vendor/marked.min.js"></script>
</head>
<body>
<div class="progress" id="progress"></div>

<!-- BG-3：星云 / 极光 / 等高线地形 / 透视地平 / 颗粒噪点（全部固定在最底层） -->
<div class="fx-bg" aria-hidden="true">
  <div class="fx-nebula"><i></i><i></i><i></i></div>
  <div class="fx-aurora"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="fx-terrain"></div>
  <div class="fx-horizon"><i class="plane"></i></div>
  <div class="fx-grain"></div>
</div>

<!-- FX-2：视差星野 / 星舰光标（含航迹与引擎焰）/ 换页冲击波 / HUD 遥测 / 开机自检 -->
<canvas class="fx-stars" id="fxStars" aria-hidden="true"></canvas>
<canvas class="fx-trail" id="fxTrail" aria-hidden="true"></canvas>
<div class="fx-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="fx-wipe" id="fxWipe" aria-hidden="true"></div>
<div class="fx-hud" id="fxHud" aria-hidden="true">
  <span class="hud-dot"></span>
  <span class="hud-sec" id="hudSec">INDEX</span>
  <span class="hud-sep">/</span>
  <span class="hud-num" id="hudPct">0%</span>
  <span class="hud-sep">/</span>
  <span class="hud-num" id="hudTime">--:--:--</span>
</div>
<div class="fx-boot" id="fxBoot" aria-hidden="true">
  <div class="fx-boot-inner">
    <div class="fx-boot-title"><b>创</b> · FOUNDER OS</div>
    <div class="fx-boot-log" id="fxBootLog"></div>
    <div class="fx-boot-bar"><i id="fxBootBar"></i></div>
    <div class="fx-boot-hint">点击任意位置跳过</div>
  </div>
</div>

<header class="topbar">
  <button class="icon-btn menu" id="btnMenu" aria-label="菜单">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <div class="logo"><b>创</b><span class="full">业者行动指南</span></div>
  <div class="spacer"></div>
  <div class="search-pill" id="searchPill" role="button" tabindex="0" aria-label="搜索">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
    <span>搜索文档</span><span class="kbd">⌘K</span>
  </div>
  <button class="icon-btn" id="btnTheme" aria-label="切换主题" title="切换主题">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>
  </button>
  <button class="icon-btn" id="btnGit" aria-label="GitHub 仓库" title="GitHub 仓库">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.1-1.47-1.1-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.88 1.52 2.31 1.08 2.87.83.09-.64.35-1.08.63-1.33-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.5 9.5 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/></svg>
  </button>
</header>

<div class="scrim" id="scrim"></div>
<div class="layout">
  <aside class="side" id="side"></aside>
  <main class="content">
    <div class="crumb" id="crumb"></div>
    <article class="doc" id="doc"><div class="splash"><div class="spin"></div>加载中…</div></article>
    <div class="pager" id="pager"></div>
    <footer class="site-foot" id="siteFoot"></footer>
  </main>
</div>

<button class="to-top" id="toTop" aria-label="回到顶部">↑</button>

<!-- 搜索面板 -->
<div class="search-box" id="searchBox">
  <div class="search-card">
    <input id="searchInput" type="text" placeholder="输入关键词搜索全文（支持中文）…" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var S = window.SITE, FLAT = window.FLAT;
  var cache = {};          // path -> {text, html, title}
  var curFile = null;
  var $ = function (id) { return document.getElementById(id); };
  var docEl = $("doc"), crumbEl = $("crumb"), pagerEl = $("pager"), sideEl = $("side");
  var lastSearchQuery = "";

  /* ---------- 主题 ---------- */
  // v2：改用新键位，避免旧的浅色偏好覆盖新的暗黑默认值（一次性迁移）
  var THEME_KEY = "sg-theme-v2";
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    var btn = $("btnTheme");
    var label = t === "dark" ? "切换到浅色" : "切换到深色";
    btn.setAttribute("aria-label", label);
    btn.setAttribute("title", label);
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }
  (function initTheme() {
    var saved = null; try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    // 默认走暗黑霓虹；用户手动切过一次后尊重其选择
    applyTheme(saved || "dark");
  })();
  $("btnTheme").onclick = function () {
    var cur = document.documentElement.getAttribute("data-theme");
    applyTheme(cur === "dark" ? "light" : "dark");
  };

  /* ---------- 路径编码（中文路径） ---------- */
  function enc(f) {
    return f.split("/").map(encodeURIComponent).join("/");
  }

  /* ---------- 板块识别：取路径首段，用于按板块换色 ---------- */
  var SECS = ["公司", "家族", "个人与人际", "未来与投资", "附录"];
  function secOf(f) {
    var g = (f || "").split("/")[0];
    return SECS.indexOf(g) >= 0 ? g : "";
  }
  function setPageSec(f) {
    var s = secOf(f);
    if (s) document.documentElement.setAttribute("data-sec", s);
    else document.documentElement.removeAttribute("data-sec");
    hudSecUpdate();                    // 左下角遥测条同步显示当前板块
  }
  /* 给指向各板块的站内链接打色标 —— 一眼看出这条链接跳到哪个板块 */
  function tagLinks() {
    var as = docEl.querySelectorAll("a[href]");
    for (var i = 0; i < as.length; i++) {
      var m = (as[i].getAttribute("href") || "").match(/^#\/([^#]+)/);
      if (!m) continue;
      var p; try { p = decodeURIComponent(m[1]); } catch (e) { p = m[1]; }
      var s = secOf(p);
      if (s) as[i].setAttribute("data-sec", s);
    }
  }

  /* ---------- 侧栏 ---------- */
  function buildNav() {
    var h = "";
    h += '<div class="group"><a class="item" data-f="' + S.home.f + '" href="#/' + enc(S.home.f) + '">' + S.home.t + '</a></div>';
    S.groups.forEach(function (g) {
      var sk = secOf(g.items.length ? g.items[0].f : "");
      h += '<div class="group"' + (sk ? ' data-sec="' + sk + '"' : "") + '><div class="group-name">' + g.name + "</div>";
      g.items.forEach(function (it) {
        h += '<a class="item" data-f="' + it.f + '" href="#/' + enc(it.f) + '">' + it.t + "</a>";
      });
      h += "</div>";
    });
    sideEl.innerHTML = h;
    sideEl.addEventListener("click", function (e) {
      var a = e.target.closest("a.item");
      if (a) closeNav();
    });
  }
  function setActive(f) {
    var items = sideEl.querySelectorAll("a.item");
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle("active", items[i].getAttribute("data-f") === f);
    }
  }
  /* 移动端抽屉 */
  function openNav() { document.body.classList.add("nav-open"); }
  function closeNav() { document.body.classList.remove("nav-open"); }
  $("btnMenu").onclick = openNav;
  $("scrim").onclick = closeNav;
  window.addEventListener("resize", function () { if (innerWidth > 900) closeNav(); });

  /* ---------- Markdown 渲染配置 ---------- */
  marked.setOptions({ gfm: true, breaks: false });
  /* 站内相对链接规范化：把 md 里相对「所在目录」的链接解析回仓库根路径 */
  var curSegs = [];   // 当前文档所在目录的路径段，如 ['公司'] / []
  function normJoin(rel) {
    var seg = curSegs.slice();
    rel.split("/").forEach(function (p) {
      if (!p || p === ".") return;
      if (p === "..") { if (seg.length) seg.pop(); }
      else seg.push(p);
    });
    return seg.join("/");
  }
  var renderer = new marked.Renderer();
  renderer.link = function (href, title, text) {
    if (!href) return text;
    if (/^https?:|^mailto:/i.test(href)) {
      return '<a href="' + href + '" target="_blank" rel="noopener"' + (title ? ' title="' + title + '"' : "") + ">" + text + "</a>";
    }
    if (href.charAt(0) === "#") {   // 同页锚点
      return '<a href="' + href + '"' + (title ? ' title="' + title + '"' : "") + ">" + text + "</a>";
    }
    var target = normJoin(href);    // 站内相对 → 仓库根路径
    var isMd = /\.md$/i.test(target);
    return '<a href="' + (isMd ? "#/" + enc(target) : enc(target)) + '"' + (title ? ' title="' + title + '"' : "") + ">" + text + "</a>";
  };
  renderer.image = function (href, title, text) {
    var src = /^https?:/i.test(href) ? href : enc(normJoin(href));
    return '<img src="' + src + '" alt="' + (text || "") + '"' + (title ? ' title="' + title + '"' : "") + ">";
  };
  marked.setOptions({ renderer: renderer });

  /* ---------- 文档加载 ---------- */
  function guessTitle(text) {
    var m = text.match(/^#\s+(.+)$/m);
    return m ? m[1].trim() : "";
  }
  function fetchDoc(f) {
    return fetch(enc(f), { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    });
  }
  function ensure(f) {
    if (cache[f]) return Promise.resolve(cache[f]);
    return fetchDoc(f).then(function (text) {
      var title = guessTitle(text);
      curSegs = f.indexOf("/") >= 0 ? f.split("/").slice(0, -1) : [];
      var html = marked.parse(text);
      cache[f] = { text: text, html: html, title: title };
      return cache[f];
    });
  }
  function docLinkText(f) {
    for (var i = 0; i < FLAT.length; i++) if (FLAT[i].f === f) return FLAT[i].t;
    return f.replace(/\.md$/, "");
  }
  function load(f, fromHash) {
    var promise;
    if (curFile === f && cache[f]) promise = Promise.resolve(cache[f]);
    else promise = ensure(f);
    if (!fromHash && history.replaceState) {
      try { history.replaceState(null, "", "#/" + enc(f)); } catch (e) {}
    }
    promise.then(function (d) {
      curFile = f;
      setPageSec(f);            // 整页换色：标题/链接/表头/进度条/背景光晕全部跟随
      setActive(f);
      var siteT = "年轻创业者行动指南";
      document.title = d.title && d.title !== siteT ? d.title + " · " + siteT : siteT;
      crumbEl.innerHTML = crumbFor(d.title);
      docEl.innerHTML = d.html;
      injectIds();
      buildToc(d);
      tagLinks();
      buildPager(f);
      markSearch();
      window.scrollTo(0, 0);
      armReveal();
      wipe();               // 换页冲击波（首次进入不播）
      decodeH1();           // 标题字形逐帧落定
      onScroll();           // 立刻同步 HUD 读数的百分比
      // 记住位置（含锚点）
      var key = "sg-last"; try { localStorage.setItem(key, f); } catch (e) {}
      var anchor = location.hash.replace(/^#\/.*?(?=#|$)/, "");
      if (anchor && fromHash) {
        var aId = null;
        try { aId = decodeURIComponent(anchor.slice(1)); } catch (err) { aId = anchor.slice(1); }
        var el = document.getElementById(aId);
        if (el) setTimeout(function () { el.scrollIntoView(); }, 30);
      }
    }).catch(function (err) {
      // 友好化：不再只丢一行报错，给出可点的出口（回首页 / 去搜索 / 看同类文档）
      if (io) io.disconnect();
      curFile = null;
      setPageSec("");
      setActive("");
      crumbEl.innerHTML = crumbFor("未找到");
      pagerEl.innerHTML = "";
      document.title = "未找到 · 年轻创业者行动指南";
      var guess = f.replace(/\.md$/i, "").split("/").pop().replace(/^\d+-/, "");
      docEl.innerHTML =
        '<div class="doc-error">' +
          '<div class="err-code">404</div>' +
          '<div class="err-title">找不到这篇文档</div>' +
          '<div class="err-path">' + f + "</div>" +
          '<div class="err-hint">可能是链接拼写有误，或这篇内容被改名/移动过。</div>' +
          '<div class="err-acts">' +
            '<a class="err-btn primary" href="#/">返回首页</a>' +
            '<a class="err-btn" href="#" id="errSearch">搜索「' + guess + '」</a>' +
          "</div>" +
        "</div>";
      var sb = $("errSearch");
      if (sb) sb.onclick = function (ev) {
        ev.preventDefault();
        openSearch();
        $("searchInput").value = guess;
        doSearch(guess);
      };
    });
  }
  function crumbFor(title) {
    return '<a href="#/">首页</a> / <span>' + (title || "") + "</span>";
  }
  /* 给 h1-h3 加锚点 id（兼容 GitHub 中文锚点命名） */
  function slug(s) {
    return s.trim().toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g, "-").replace(/^-+|-+$/g, "") || "sec";
  }
  function injectIds() {
    var hs = docEl.querySelectorAll("h1, h2, h3");
    var used = {};
    hs.forEach(function (h) {
      var base = slug(h.textContent);
      var id = base, n = 1;
      while (used[id]) { id = base + "-" + (++n); }
      used[id] = 1;
      h.id = id;
    });
  }
  function buildToc(d) {
    var old = docEl.querySelector(".toc-box");
    if (old) old.remove();
    var hs = docEl.querySelectorAll("h2, h3");
    if (hs.length < 3) return;
    var html = "<details class='toc-box' open><summary>目录 · CONTENTS</summary><ul>";
    hs.forEach(function (h) {
      var lv = h.tagName === "H2" ? "lv2" : "lv3";
      // 链接用站点路由格式 #/文件.md#锚点：新标签打开/深链也能正确落到锚点，不会把 hash 顶掉而跳回首页
      html += "<li class='" + lv + "'><a href='#/" + enc(curFile) + "#" + encodeURIComponent(h.id) + "'>" + h.textContent + "</a></li>";
    });
    html += "</ul></details>";
    var firstH2 = docEl.querySelector("h2");
    if (firstH2) firstH2.insertAdjacentHTML("beforebegin", html);
    else docEl.insertAdjacentHTML("beforeend", html);
  }

  /* ---------- 页内锚点点击：短距离平滑滚动，长距离直接跳（避免整屏高速掠过/动画打架的乱感） ---------- */
  docEl.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a") : null;
    if (!a) return;
    var h = a.getAttribute("href") || "";
    var id = null;
    var m2 = h.match(/^#\/[^#]*#([\s\S]+)$/);           // #/文件.md#锚点
    if (m2) {
      try { id = decodeURIComponent(m2[1]); } catch (err) { id = m2[1]; }
    } else if (h.charAt(0) === "#" && h.indexOf("#/") !== 0) {  // 裸 #锚点
      try { id = decodeURIComponent(h.slice(1)); } catch (err) { id = h.slice(1); }
    }
    if (!id) return;
    var el = document.getElementById(id);
    if (!el || !docEl.contains(el)) return;   // 找不到目标 = 跨文档链接，交给默认行为
    e.preventDefault();
    // 目标标题距视口顶部 ~66px（吸顶栏 52 + 留白）
    var dist = el.getBoundingClientRect().top - 66;
    window.scrollTo({
      top: Math.max(0, window.scrollY + dist),
      behavior: Math.abs(dist) > window.innerHeight * 0.6 ? "auto" : "smooth"
    });
    try { history.replaceState(null, "", "#/" + enc(curFile) + "#" + encodeURIComponent(id)); } catch (err) {}
  });
  function buildPager(f) {
    var idx = -1;
    for (var i = 0; i < FLAT.length; i++) if (FLAT[i].f === f) { idx = i; break; }
    var prev = idx > 0 ? FLAT[idx - 1] : null;
    var next = idx >= 0 && idx < FLAT.length - 1 ? FLAT[idx + 1] : null;
    var h = "";
    if (prev) h += '<a href="#/' + enc(prev.f) + '"><span class="dir">← 上一篇</span><span class="tt">' + prev.t + "</span></a>";
    else h += "<a style='visibility:hidden'></a>";
    if (next) h += '<a href="#/' + enc(next.f) + '"><span class="dir">下一篇 →</span><span class="tt">' + next.t + "</span></a>";
    pagerEl.innerHTML = h;
  }

  /* ---------- 全文搜索 ---------- */
  var allDocsReady = false;
  function preloadAll() {
    /* 分批预热：一次性开 30 条连接会把浏览器的并发额度占满，
       用户此时点侧栏就得排队等（弱网下能等出好几秒）。改成每批 4 篇、
       批间让出一帧，用户的手动导航永远优先。 */
    var i = 0;
    function batch() {
      if (i >= FLAT.length) { allDocsReady = true; return; }
      var ps = FLAT.slice(i, i + 4).map(function (it) { return ensure(it.f).catch(function () {}); });
      i += 4;
      Promise.all(ps).then(function () { setTimeout(batch, 30); });
    }
    return batch();
  }
  function ctxSnippet(text, q, max) {
    var idx = text.indexOf(q);
    if (idx < 0) return "";
    var start = Math.max(0, idx - max);
    var end = Math.min(text.length, idx + q.length + max);
    var s = text.slice(start, end).replace(/[#*`>|]/g, "").replace(/\s+/g, " ");
    if (start > 0) s = "…" + s;
    if (end < text.length) s = s + "…";
    return s;
  }
  function doSearch(q) {
    var box = $("searchResults");
    q = q.trim();
    lastSearchQuery = q;
    if (!q) { box.innerHTML = '<div class="none">输入关键词，全文即时搜索</div>'; return; }
    var results = [];
    FLAT.forEach(function (it) {
      var d = cache[it.f];
      if (!d) return;
      var low = d.text.toLowerCase(), lq = q.toLowerCase();
      var idx = low.indexOf(lq);
      if (idx < 0) return;
      results.push({ t: it.t, f: it.f, g: it.g, snip: ctxSnippet(d.text, low, 60) });
    });
    if (!results.length) { box.innerHTML = '<div class="none">没有匹配「' + q + '」的内容，换个关键词试试</div>'; return; }
    var h = "";
    results.forEach(function (r) {
      h += '<a href="#/' + enc(r.f) + '" data-q="' + q.replace(/"/g, "&quot;") + '">'
         + '<div class="r-t">' + r.t + '</div>'
         + '<div class="r-f">' + (r.g || "首页") + "</div>"
         + '<div class="r-s">' + r.snip + "</div></a>";
    });
    box.innerHTML = h;
  }
  /* 打开搜索 */
  function openSearch() { $("searchBox").classList.add("open"); setTimeout(function () { $("searchInput").focus(); }, 30); if (!allDocsReady) preloadAll(); }
  function closeSearch() { $("searchBox").classList.remove("open"); }
  $("searchPill").onclick = openSearch;
  $("searchBox").addEventListener("click", function (e) { if (e.target === $("searchBox")) closeSearch(); });
  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openSearch(); }
    if (e.key === "Escape") { closeSearch(); closeNav(); }
  });

             梯度也正好是根部白热、外缘转红黄，所以暖色不违和，反而补上
             全站唯一的一处冷暖对比。深浅底各备一套：深底走 lighter 叠加，
             亮色会自然烧起来；浅底压 alpha、内芯改用深褐橙（浅底上"白"看不见，
             越深才越"实"）。
             焰长随推力（全推约 54px，怠速剩一簇 ~16px 的小火苗），再叠三层不同频率的
             抖动：~0.6s 的慢脉动 + ~0.12s 的快颤 + 火舌整体左右摆；双股焰
             左右相位错开 —— 火苗不同步才像活的。 */
      if (en > .02) {
        var fV = (.82 + .18 * a) * (1 - .55 * (o.txt || 0));  // 静止/输入框里收敛
        var L = (14 + 34 * en) * (.8 + .14 * Math.sin(tf * .16)
                  + .1 * Math.sin(tf * .77 + 1.3) + .06 * Math.sin(tf * 1.9 + .4));
        var sw = Math.sin(tf * .23) * 1.1 + Math.sin(tf * .61 + .9) * .6;   // 火舌横摆

        /* 外焰：最长最淡，根部略窄、腰上外鼓，尖端收成一点 */
        /* 注意 alpha 的写法：**不能用 en 直接线性乘**。怠速推力只有 .14，
           一乘就把火压到 0.03 的透明度 —— 屏幕上什么都没有（踩过的坑）。
           火苗短 ≠ 火苗弱，所以给每层一个基座透明度，en 只做小幅加成：
           怠速时是一簇清晰的小火苗，全推时才烧到最亮。 */
        var enA = .72 + .28 * en;
        var g1 = ctx.createLinearGradient(-10.7, 0, -11.7 - L, 0);
        g1.addColorStop(0, light ? "rgba(208,92,18," + ((.44 * enA) * fV) + ")"
                                 : "rgba(255,130,38," + ((.5 * enA) * fV) + ")");
        g1.addColorStop(.38, light ? "rgba(224,112,26," + ((.26 * enA) * fV) + ")"
                                   : "rgba(255,168,66," + ((.3 * enA) * fV) + ")");
        g1.addColorStop(1, light ? "rgba(224,112,26,0)" : "rgba(255,196,110,0)");
        ctx.fillStyle = g1;
        ctx.beginPath();
        ctx.moveTo(-10.7, -3.3);
        ctx.bezierCurveTo(-11 - L * .22, -4.5, -11.3 - L * .6, -1.7, -11.8 - L, sw);
        ctx.bezierCurveTo(-11.3 - L * .6, 1.7, -11 - L * .22, 4.5, -10.7, 3.3);
        ctx.closePath();
        ctx.fill();

        /* 中焰：尾部左右两口各一股，保留"双喷管"结构（别并成一股，会丢掉星舰感） */
        var g2 = ctx.createLinearGradient(-10.7, 0, -11.3 - L, 0);
        g2.addColorStop(0, light ? "rgba(196,76,12," + ((.58 * enA) * fV) + ")"
                                 : "rgba(255,184,68," + ((.8 * enA) * fV) + ")");
        g2.addColorStop(.5, light ? "rgba(212,100,20," + ((.34 * enA) * fV) + ")"
                                  : "rgba(255,222,142," + ((.5 * enA) * fV) + ")");
        g2.addColorStop(1, light ? "rgba(212,100,20,0)" : "rgba(255,245,206,0)");
        ctx.fillStyle = g2;
        for (i2 = -1; i2 <= 1; i2 += 2) {
          y0 = i2 * 1.15;                                    // 尾部左右两口喷管
          var Li = L * (.74 + .12 * Math.sin(tf * .45 + i2 * 2.2));   // 左右火焰不同步
          ctx.beginPath();
          ctx.moveTo(-10.7, y0 - 1.5);
          ctx.bezierCurveTo(-10.8 - Li * .3, y0 - 1.8, -11 - Li * .58, y0 * .6 - .7,
                            -11.3 - Li, y0 * .35 + sw * .55);
          ctx.bezierCurveTo(-11 - Li * .58, y0 * .6 + .7, -10.8 - Li * .3, y0 + 1.8,
                            -10.7, y0 + 1.5);
          ctx.closePath();
          ctx.fill();
        }

        /* 内芯：白热高温区，最短最窄最亮 —— 缺了它整团只是"橙色色块" */
        var Lc = L * .44;
        var g3 = ctx.createLinearGradient(-10.9, 0, -11.35 - Lc, 0);
        g3.addColorStop(0, light ? "rgba(164,54,10," + ((.72 * enA) * fV) + ")"
                                 : "rgba(255,255,255," + ((1.0 * enA) * fV) + ")");
        g3.addColorStop(.55, light ? "rgba(178,66,14," + ((.4 * enA) * fV) + ")"
                                   : "rgba(255,252,234," + ((.62 * enA) * fV) + ")");
        g3.addColorStop(1, light ? "rgba(178,66,14,0)" : "rgba(255,250,218,0)");
        ctx.fillStyle = g3;
        ctx.beginPath();
        ctx.moveTo(-10.9, -1.8);
        ctx.bezierCurveTo(-11 - Lc * .35, -1.4, -11.15 - Lc * .7, -.5, -11.35 - Lc, sw * .3);
        ctx.bezierCurveTo(-11.15 - Lc * .7, .5, -11 - Lc * .35, 1.4, -10.9, 1.8);
        ctx.closePath();
        ctx.fill();

        /* 喷口炽热点：两口各一枚、随抖动呼吸，火是"从这里长出来"的 */
        ctx.fillStyle = light ? "rgba(180,62,12," + ((.72 * enA) * fV) + ")"
                              : "rgba(255,246,222," + ((1.0 * enA) * fV) + ")";
        for (i2 = -1; i2 <= 1; i2 += 2) {
          ctx.beginPath();
          ctx.arc(-11, i2 * 1.15, 1.1 + .3 * Math.sin(tf * .8 + i2 * 1.7), 0, 6.2832);
          ctx.fill();
        }
      }

      /* ② 双翼：两块大后掠三角翼面。翼尖要放到机身中后段（-4.4 ~ -6.6），
             前缘才会拉出一条长斜线；翼尖若留在机身中段，整舰会读成"菱形"
             而不是星舰。翼面必须留面积，只连一条细线同样读不出翼 */
      ctx.beginPath();
      ctx.moveTo(4.6, -2.7); ctx.lineTo(-4.4, -11.8);      // 左翼前缘
      ctx.lineTo(-6.6, -10.8); ctx.lineTo(-8.6, -2.7);     // 翼尖后 → 翼后根
      ctx.closePath();
      ctx.moveTo(4.6, 2.7); ctx.lineTo(-4.4, 11.8);        // 右翼，镜像
      ctx.lineTo(-6.6, 10.8); ctx.lineTo(-8.6, 2.7);
      ctx.closePath();
      ctx.fillStyle = rgb(col, (light ? .16 : .1) * (.5 + .5 * lit));
      ctx.fill();
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.strokeStyle = rgb(col, .28 * vis * (.4 + .6 * lit));   // 辉光层
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.strokeStyle = rgb(col, (.42 + .42 * lit) * vis);       // 轮廓层
      ctx.lineWidth = 1.25;
      ctx.stroke();

      /* ③ 机身：舰首尖 → 等宽尾段 → 尾部略收，盖在双翼之上。
             分两层画才有"机体 + 翼面"的结构感 */
      ctx.beginPath();
      ctx.moveTo(16.0, 0);            // 舰首尖
      ctx.lineTo(6.2, -2.35);
      ctx.lineTo(-7.4, -2.35);
      ctx.lineTo(-10.8, -1.8);        // 尾段小幅收拢
      ctx.lineTo(-10.8, 1.8);
      ctx.lineTo(-7.4, 2.35);
      ctx.lineTo(6.2, 2.35);
      ctx.closePath();
      ctx.fillStyle = rgb(col, (light ? .27 : .19) * (.5 + .5 * lit));
      ctx.fill();
      ctx.strokeStyle = rgb(col, .34 * vis * (.4 + .6 * lit));    // 辉光层
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.strokeStyle = rgb(col, (.6 + .4 * lit) * vis);          // 轮廓层
      ctx.lineWidth = 1.35;
      ctx.stroke();

      /* ④ 翼前缘受光：沿两侧前缘再来一条亮线，勾出"人字"机翼。
             这是全舰最有效的一条识别线索 —— 一眼就是飞机不是图形 */
      ctx.strokeStyle = light ? rgb(col, .48 * (.4 + .6 * lit))
                              : "rgba(232,251,255," + (.4 * (.4 + .6 * lit)) + ")";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(6.0, -2.5); ctx.lineTo(-4.4, -11.8);
      ctx.moveTo(6.0, 2.5);  ctx.lineTo(-4.4, 11.8);
      ctx.stroke();

      /* ⑤ 机身脊线 + 座舱盖：给"长机身"一点实体感，座舱是全舰最亮的点 */
      ctx.strokeStyle = light ? rgb(col, .3 * (.4 + .6 * lit))
                              : "rgba(226,250,255," + (.34 * (.4 + .6 * lit)) + ")";
      ctx.lineWidth = .9;
      ctx.beginPath();
      ctx.moveTo(15.0, 0); ctx.lineTo(4.4, 0);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(9.6, 0);
      ctx.lineTo(3.8, -1.65);
      ctx.lineTo(3.1, 1.65);
      ctx.closePath();
      ctx.fillStyle = light ? rgb(col, .7 * (.4 + .6 * lit))
                            : "rgba(240,253,255," + (.8 * (.4 + .6 * lit)) + ")";
      ctx.fill();

      /* ⑥ 翼灯：两枚次级色小灯，悬停时同步增亮 */
      ctx.fillStyle = rgb(col2, (.48 + .34 * hot + .18 * Math.sin(tf * .12)) * vis);
      ctx.beginPath(); ctx.arc(-5.5, -11.3, .95, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc(-5.5, 11.3, .95, 0, 6.2832); ctx.fill();

      /* ⑦ 前向护盾弧：悬停到可点元素上时撑开变亮，替代原"锁定刻度"
             的确认语义（4 道直刻度换成一片弧形力场，更像护盾） */
      if (sh > .02) {
        ctx.strokeStyle = rgb(col, .72 * sh * vis);
        ctx.lineWidth = 1.1 + .5 * sh;
        ctx.beginPath();
        ctx.arc(2.6, 0, 14 + 4.5 * sh, -.92 + .18 * sh, .92 - .18 * sh);
        ctx.stroke();
        /* 两条从翼尖向前伸的锁定线，指示"已捕获目标" */
        if (hot > .2) {
          ctx.strokeStyle = rgb(col, .5 * hot * vis);
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(-5.5, -11.3); ctx.lineTo(6.4, -6.3);
          ctx.moveTo(-5.5, 11.3);  ctx.lineTo(6.4, 6.3);
          ctx.stroke();
        }
      }
      ctx.restore();

      /* ⑥ 传感器芯点：不随舰体旋转，永远钉在真实指针坐标上（此处 transform
             只剩调用方的 translate，所以画在局部原点就是绝对指针位置）。
             它才是"指到哪"的精确答案，也是旋转视觉里的稳定锚点。 */
      var core = (.62 + .38 * a) * (1 - .25 * (o.txt || 0));
      ctx.fillStyle = light ? rgb(col, .85 * core)
                            : "rgba(255,255,255," + (core * (1 + .12 * hot)) + ")";
      ctx.beginPath(); ctx.arc(0, 0, 1.4 + .7 * hot, 0, 6.2832); ctx.fill();
    }

    /* 待机：指针还在页面里、但已静止且特效收净 → 只保留淡舰体，降频省电 */
    function isSlow() { return x > -1e3 && idle > IDLE && !parts.length && a < .02; }

    function frame() {
      handle = 0;
      if (!live) return;
      beat++;
      /* 时间归一：所有插值换算成"相对 60Hz 的倍率"，120Hz ProMotion 上手感才一致 */
      var now = performance.now();
      var dt = Math.min(64, now - last);
      var k = Math.max(.25, dt / 16.67);
      last = now;
      var kA = 1 - Math.pow(.9, k);
      var kH = 1 - Math.pow(.7, k);
      var kP = 1 - Math.pow(.78, k);
      var kD = Math.pow(.93, k);
      tf += k;
      if (now - colT > 480) { colT = now; readColor(); }

      idle += dt;
      var slow = isSlow();
      /* 待机时只清舰体周围一小块，不必每帧全屏 clearRect。
         半径要盖住：舰体半长 14 + 引擎焰 38 + 柔光 62 → 取 120 有富余 */
      if (slow && slowPrev) ctx.clearRect(x - 120, y - 120, 240, 240);
      else ctx.clearRect(0, 0, W, H);
      slowPrev = slow;

      var i, p, t;
      var on = x > -1e3 && idle < IDLE;
      a += ((on ? 1 : 0) - a) * kA;

      /* 指针已离开视口且特效收净 → 清屏停帧（此时系统箭头已还给用户） */
      if (x < -1e3 && !parts.length && a < .006) { ctx.clearRect(0, 0, W, H); return; }

      /* 速度与朝向：用真实指针的帧间位移，按 60Hz 归一 */
      var vx = 0, vy = 0, sp = 0;
      if (x > -1e3 && px > -1e3) {
        vx = (x - px) / k; vy = (y - py) / k;
        sp = Math.sqrt(vx * vx + vy * vy);
        if (sp > 240) rib.length = 0;            // 跨屏瞬移不拉丝
      }
      px = x; py = y;

      /* 轨迹：按"走过的距离"落点，尾巴长度与刷新率彻底解耦 */
      if (a > .02 && x > -1e3) {
        var n0 = rib.length;
        var ddx = n0 ? x - rib[n0 - 2] : 1e4, ddy = n0 ? y - rib[n0 - 1] : 1e4;
        if (!n0 || ddx * ddx + ddy * ddy > STEP * STEP) {
          rib.push(x, y);
          if (rib.length > RIB * 2) { rib.shift(); rib.shift(); }
          shrink = 0;
        } else if (idle > 110) {
          /* 停下：不是原地淡出，而是尾巴从末端"收干"回去 —— 约 0.4s 收完 */
          shrink = Math.min(shrink + (RIB / 400) * dt, 2);
          while (shrink >= 1 && rib.length > 2) { rib.shift(); rib.shift(); shrink -= 1; }
        }
      } else if (a <= .02) { rib.length = 0; }

      var light = html.getAttribute("data-theme") === "light";
      ctx.globalCompositeOperation = light ? "source-over" : "lighter";

      /* ① 彗尾：两层描边 —— 外层次级色光晕（宽而淡），内层主色芯（细而亮） */
      var n = rib.length / 2;
      if (n > 2) {
        ctx.lineCap = "round";
        for (i = 1; i < n; i++) {
          t = i / n;
          ctx.strokeStyle = rgb(col2, t * t * (light ? .1 : .2) * a + .005);
          ctx.lineWidth = t * 9.5 + .8;
          ctx.beginPath();
          ctx.moveTo(rib[(i - 1) * 2], rib[(i - 1) * 2 + 1]);
          ctx.lineTo(rib[i * 2], rib[i * 2 + 1]);
          ctx.stroke();
        }
        for (i = 1; i < n; i++) {
          t = i / n;
          ctx.strokeStyle = rgb(col, t * t * (light ? .34 : .5) * a + .012);
          ctx.lineWidth = t * 3.4 + .3;
          ctx.beginPath();
          ctx.moveTo(rib[(i - 1) * 2], rib[(i - 1) * 2 + 1]);
          ctx.lineTo(rib[i * 2], rib[i * 2 + 1]);
          ctx.stroke();
        }
      }

      /* ② 星舰：就是光标本体。舰体中心钉在指针上，舰首朝航向偏转，
             悬停可点元素撑开护盾弧，按下机身前倾，高速时沿航向拉伸 */
      if (x > -1e3) {
        hot += ((hovLink ? 1 : 0) - hot) * kH;
        press += ((down ? 1 : 0) - press) * kP;
        var txt = hovText ? 1 : 0;                       // 在输入框里：收小、熄引擎
        var sc = (1 - .3 * txt) * (1 + .12 * hot - .1 * press);
        var str = Math.min(1, sp / 30);

        /* 航向：跟上运动方向，带角惯性（约 0.1s 的转向时间常数，像压坡度）。
           静止时**不回正** —— 船停在最后前进的朝向上，像真的悬停在那里。
           角度差必须先折进 ±π，否则从 +179° 转到 -179° 会绕远路转一整圈。 */
        if (sp > .55) angT = Math.atan2(vy, vx);
        var dA = ((angT - ang + Math.PI * 3) % 6.2832) - Math.PI;
        ang += dA * (1 - Math.pow(.84, k));
        if (ang > Math.PI) ang -= 6.2832; else if (ang < -Math.PI) ang += 6.2832;

        /* 推力 → 焰长：速度越快喷得越长；静止悬停留一簇怠速火苗，
           待机（指针久不动）也留住一个更小的火苗 —— 船停在半空不该是冷的 */
        var engT = !on ? .1 : (sp > .6 ? Math.min(1, sp / 8.5) : .14);
        eng += (engT - eng) * (1 - Math.pow(.8, k));
        eng = eng < 0 ? 0 : (eng > 1 ? 1 : eng);

        /* 外圈柔光（活跃时才有） */
        if (a > .05) {
          var R = 54 * sc;
          var g = ctx.createRadialGradient(x, y, 0, x, y, R);
          g.addColorStop(0, rgb(col, (.15 + .14 * hot) * a * (1 - .6 * txt)));
          g.addColorStop(.42, rgb(col, .05 * a));
          g.addColorStop(1, rgb(col, 0));
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(x, y, R, 0, 6.2832); ctx.fill();

          /* 雷达脉冲：每 2.6s 一圈向外扩散的淡环，像在持续扫描 */
          pulse += dt / 2600; if (pulse > 1) pulse -= 1;
          if (pulse < .62) {
            ctx.strokeStyle = rgb(col, (1 - pulse / .62) * .2 * a * (1 - txt));
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(x, y, 13 + pulse * 64, 0, 6.2832); ctx.stroke();
          }
        }

        ctx.save();
        ctx.translate(x, y);
        drawShip(sc, {
          vis: .74 + .26 * a,                            // 待机也得看得见（系统箭头已让位）
          lit: .45 + .55 * a + .25 * hot,
          eng: eng * (1 - .35 * press * txt),
          shield: a > .05 ? hot * (.5 + .5 * a) : 0,
          stretch: txt ? 0 : str, light: light, txt: txt
        });
        ctx.restore();
      }

      /* ③ 行进时从尾喷口向后甩火星：方向锁在航向的反向（±63° 锥角），快则溅得远 */
      if (on && a > .35 && sp > 1.2) {
        var cA = Math.cos(ang), sA = Math.sin(ang);
        var back = ang + Math.PI;
        var cnt = Math.round(Math.min(5, 1 + (sp / 3.5 | 0)) * Math.min(2, k));
        for (i = 0; i < cnt; i++) {
          var ang2 = back + (Math.random() - .5) * 2.2;
          var m = (Math.random() * .8 + .35) * Math.min(6, sp * .55 + .8);
          var off = (Math.random() - .5) * 6;              // 沿翼展方向散开，不从一点冒
          spawn(x - cA * 11 - sA * off, y - sA * 11 + cA * off,
                Math.cos(ang2) * m, Math.sin(ang2) * m,
                24 + Math.random() * 26, Math.random() * 1.5 + .9,
                Math.random() < .28);
        }
      }

      /* ④ 火星池（点击炸开的也在这里衰减） */
      for (i = parts.length - 1; i >= 0; i--) {
        p = parts[i];
        p.x += p.vx * k; p.y += p.vy * k;
        p.vx *= kD; p.vy = p.vy * kD + .012 * k;    // 轻微下坠，像散落火星
        if ((p.t -= k) <= 0) { parts.splice(i, 1); continue; }
        var fade = p.t / p.m;
        ctx.fillStyle = p.w ? "rgba(255,255,255," + (fade * .62) + ")" : rgb(col, fade * .78);
        ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
      }

      schedule();
    }
    function schedule() {
      if (!live) return;
      if (isSlow()) { usingTimer = true; handle = setTimeout(frame, 40); }   // 待机降到 ~25fps
      else { usingTimer = false; handle = requestAnimationFrame(frame); }
    }
    /* 只在"从停歇中被唤醒"时重置时间基准 —— 每帧都重置会让 dt 退化成鼠标事件间隔 */
    function start() { if (!handle && live) { last = performance.now(); schedule(); } }
    function stop() {
      if (!handle) return;
      if (usingTimer) clearTimeout(handle); else cancelAnimationFrame(handle);
      handle = 0;
    }

    /* —— 接管系统箭头：只在 canvas 确实出过帧（beat > 0）之后才挂类 —— */
    function arm() { if (beat > 0) html.classList.add("fx-cursor"); }
    function disarm() { html.classList.remove("fx-cursor"); }

    window.addEventListener("pointermove", function (e) {
      if (e.pointerType && e.pointerType !== "mouse") return;
      x = e.clientX; y = e.clientY; idle = 0;
      var t = e.target, near = t && t.closest;
      hovLink = !!(near && t.closest("a,button,input,summary,select,.side a,.toc a"));
      hovText = !!(near && t.closest("input,textarea,[contenteditable='true']"));
      arm();
      start();
    }, { passive: true });
    /* 指针离开视口（比如移向浏览器工具栏）：清掉目标位并立刻把系统箭头还回去 */
    document.addEventListener("pointerleave", function () {
      x = y = px = py = -1e4; idle = IDLE + 500; down = false;
      disarm();
    }, { passive: true });
    window.addEventListener("pointerdown", function (e) {
      if (e.pointerType && e.pointerType !== "mouse") return;
      down = true;
    }, { passive: true });
    window.addEventListener("pointerup", function () { down = false; }, { passive: true });
    window.addEventListener("pointercancel", function () { down = false; }, { passive: true });
    window.addEventListener("blur", function () { down = false; });

    /* 心跳兜底：该出帧却不出帧（脚本报错 / 渲染卡死）→ 立刻还原系统箭头，
       绝不能让人在没有光标的情况下操作页面。待机降频属正常，不触发还原。 */
    var prevBeat = -1;
    setInterval(function () {
      if (document.hidden) { prevBeat = -1; return; }
      if (idle < IDLE) {
        if (beat === prevBeat) disarm();
        else if (x > -1e3) arm();
      }
      prevBeat = beat;
    }, 900);

    var rt = 0;
    window.addEventListener("resize", function () {
      clearTimeout(rt);
      rt = setTimeout(size, 180);
    });
    document.addEventListener("visibilitychange", function () {
      live = !document.hidden;
      if (live) { last = performance.now(); if (x > -1e3) start(); }
      else stop();
    });

    readColor(); size();
  })();

  /* ---------- 换页冲击波：首次进入不播，之后每次切文档扫一道 ---------- */
  var fxFirst = true;
  function wipe() {
    if (reduceMotion || fxFirst) { fxFirst = false; return; }
    var w = $("fxWipe");
    if (!w) return;
    w.classList.remove("run");
    void w.offsetWidth;                      // 强制重排，动画才能重启动
    w.classList.add("run");
  }

  /* ---------- 标题解码：字形逐帧"落定"（仅纯文本 h1，避免破坏内联标记） ---------- */
  function decodeH1() {
    if (reduceMotion) return;
    var el = docEl.querySelector("h1");
    if (!el || el.children.length) return;
    var finalText = el.textContent || "";
    if (!finalText || finalText.length > 40) return;
    var glyphs = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789/\\<>#*+=";
    var len = finalText.length, total = 13, frame = 0;
    el.classList.add("fx-decode");
    var iv = setInterval(function () {
      frame++;
      var p = frame / total, out = "";
      for (var i = 0; i < len; i++) {
        var ch = finalText.charAt(i);
        if (i < p * len) out += ch;
        else if (ch === " ") out += " ";
        else if (ch.charCodeAt(0) > 0x2e80) out += "·";                       // 汉字：占位符保持等宽
        else out += glyphs.charAt((Math.random() * glyphs.length) | 0);
      }
      el.textContent = out;
      if (frame >= total) {
        clearInterval(iv);
        el.textContent = finalText;
        el.classList.remove("fx-decode");
      }
    }, 32);
  }

  /* ---------- HUD 遥测：板块 / 阅读进度 / 时钟 ---------- */
  var hudSec = $("hudSec"), hudPct = $("hudPct"), hudTime = $("hudTime");
  function hudSecUpdate() {
    var s = document.documentElement.getAttribute("data-sec");
    if (hudSec) hudSec.textContent = s || "INDEX";
  }
  (function hudClock() {
    if (!hudTime) return;
    function tick() {
      var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
      hudTime.textContent = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
    }
    tick();
    setInterval(tick, 1000);
  })();

  /* ---------- 点击涟漪（仅鼠标；触屏已有原生按下反馈） ---------- */
  document.addEventListener("pointerdown", function (e) {
    if (reduceMotion || e.pointerType !== "mouse") return;
    var d = document.createElement("div");
    d.className = "fx-ripple";
    d.style.left = e.clientX + "px";
    d.style.top = e.clientY + "px";
    document.body.appendChild(d);
    if (fxSparks) fxSparks(e.clientX, e.clientY, 18);   // 光环 + 火花爆
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 640);
  }, { passive: true });

  /* ---------- 开机自检：每会话仅首屏一次，点按/按键可跳过 ---------- */
  (function boot() {
    var b = $("fxBoot");
    if (!b) return;
    if (reduceMotion) { b.remove(); return; }
    var seen = 0;
    try { seen = sessionStorage.getItem("sg-boot") ? 1 : 0; } catch (e) {}
    if (seen) { b.remove(); return; }         // 会话内已看过 → 不再打扰
    try { sessionStorage.setItem("sg-boot", "1"); } catch (e) {}

    b.style.cursor = "pointer";
    var log = $("fxBootLog"), bar = $("fxBootBar");
    var lines = [
      "&gt; 挂载 FOUNDER-OS <span class='ok'>v1.0</span>",
      "&gt; 载入知识库&nbsp;<span class='dim'>············</span> <span class='ok'>OK</span>",
      "&gt; 校验文档索引&nbsp;<span class='dim'>········</span> <span class='ok'>OK</span>",
      "&gt; 全站检索就绪&nbsp;<span class='dim'>········</span> <span class='ok'>OK</span>",
      "&gt; 系统就绪，欢迎回来 <span class='ok'>_</span>"
    ];
    var i = 0;
    var iv = setInterval(function () {
      if (i >= lines.length) { clearInterval(iv); return; }
      if (log) log.insertAdjacentHTML("beforeend", lines[i] + "<br>");
      i++;
    }, 150);
    if (bar) { bar.style.width = "0"; setTimeout(function () { bar.style.width = "100%"; }, 60); }

    var gone = false;
    function kill(fast) {
      if (gone) return;
      gone = true;
      clearInterval(iv);
      if (fast) b.classList.add("skip");
      setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, fast ? 300 : 600);
    }
    setTimeout(function () {
      b.addEventListener("click", function () { kill(true); });
      document.addEventListener("keydown", function () { kill(true); }, { once: true });
    }, 320);
    setTimeout(function () { kill(false); }, 2400);   // CSS 1.75s 淡出后收尾
  })();

  /* ---------- 滚动进度 & 回顶 ---------- */
  function onScroll() {
    var h = document.documentElement;
    var max = h.scrollHeight - innerHeight;
    var p = max > 0 ? (h.scrollTop / max) * 100 : 0;
    $("progress").style.width = p + "%";
    $("toTop").classList.toggle("show", h.scrollTop > 600);
    if (hudPct) hudPct.textContent = Math.round(p) + "%";
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
  $("toTop").onclick = function () { window.scrollTo({ top: 0, behavior: "smooth" }); };

  /* ---------- 页脚 ---------- */
  $("siteFoot").innerHTML = '年轻创业者行动指南 · 开源于 <a href="https://github.com/' + S.repo + '" target="_blank" rel="noopener">GitHub / ' + S.repo + "</a> · 内容为通用参考，不构成专业意见";

  /* ---------- 路由：所有加载统一走这里，避免首屏与 hashchange 双路径竞争 ---------- */
  function route() {
    var h = location.hash || "";
    var m = h.match(/^#\/(.+?)(?:#(.+))?$/);
    var f = null;
    if (m) {
      try { f = decodeURIComponent(m[1]); } catch (e) { f = m[1]; }
      f = f.split("?")[0];
      if (!f) f = S.home.f;
    } else {
      f = S.home.f;
    }
    load(f, true);
  }
  window.addEventListener("hashchange", route);

  /* ---------- GitHub 按钮 ---------- */
  $("btnGit").onclick = function () { window.open("https://github.com/" + S.repo, "_blank"); };

  /* ---------- 启动：先渲染当前页，再后台预热全部文档（站点体量小，便于搜索） ---------- */
  buildNav();
  route();
  setTimeout(preloadAll, 900);
})();
</script>
</body>
