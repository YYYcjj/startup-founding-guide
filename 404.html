<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0c10" media="(prefers-color-scheme: dark)">
<title>地址不存在 · 年轻创业者行动指南</title>
<style>
  :root {
    --bg: #ffffff; --panel: #fafbfc; --border: #e8eaed;
    --text: #0d1117; --text-2: #6b7280; --text-3: #9aa1ab;
    --accent: #2563eb; --accent-2: #06b6d4; --dot: #edf0f4;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0c10; --panel: #12161c; --border: #1e242d;
      --text: #e8ecf1; --text-2: #8b95a3; --text-3: #6b7480;
      --accent: #4d9dff; --accent-2: #22d3ee; --dot: #14181f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--text);
    font: 14.5px/1.75 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 520px;
    border: 1px solid var(--border); border-radius: 6px;
    background: color-mix(in srgb, var(--panel) 80%, transparent);
    padding: 34px 30px 28px;
  }
  .code {
    font-family: var(--mono); font-size: 52px; line-height: 1;
    font-weight: 300; letter-spacing: .04em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: var(--accent);
  }
  .bar { width: 34px; height: 3px; margin: 16px 0 18px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 10px; letter-spacing: -.1px; }
  p { margin: 0 0 10px; color: var(--text-2); font-size: 13.5px; }
  .path {
    font-family: var(--mono); font-size: 12px; color: var(--text-3);
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
    padding: 7px 10px; margin: 14px 0 16px; word-break: break-all;
  }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  a.btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 4px; text-decoration: none;
    border: 1px solid var(--border); color: var(--text-2);
    font-family: var(--mono); font-size: 12.5px;
    transition: border-color .15s, color .15s, background .15s;
  }
  a.btn:hover { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
  a.btn.primary { border-color: var(--accent); color: var(--accent); }
  .tip { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <div class="bar"></div>
    <h1>这个地址没有对应的文档</h1>
    <p id="lead">站点里没找到这个位置，正在把你送回首页…</p>
    <div class="path" id="pathBox"></div>
    <div class="acts">
      <a class="btn primary" id="goHome" href="./">返回首页</a>
      <a class="btn" id="goRetry" href="./" style="display:none">按此路径再试一次</a>
    </div>
    <div class="tip">正确入口：yyycjj.github.io/startup-founding-guide/ 　　文档地址都带 <code>#/</code> 前缀，例如 <code>#/公司/03-注册清单.md</code></div>
  </div>

<script>
(function () {
  "use strict";
  var BASE = "/startup-founding-guide/";
  var p = location.pathname || "";
  if (p.indexOf(BASE) === 0) p = p.slice(BASE.length);
  p = p.replace(/^\/+/, "");

  var pathBox = document.getElementById("pathBox");
  var goRetry = document.getElementById("goRetry");
  var lead = document.getElementById("lead");

  var shown = p;
  try { shown = decodeURIComponent(p); } catch (e) {}
  pathBox.textContent = p ? "你访问的路径：" + shown : "你访问的是站点根目录的上级地址";

  // 只有看起来像文档路径（以 .md 结尾）才映射成站内路由重试，否则直接回首页
  var mapped = /\.md$/i.test(p) ? BASE + "#/" + p : BASE;
  if (/\.md$/i.test(p)) {
    goRetry.href = mapped;
    goRetry.style.display = "";
  }

  var t = setTimeout(function () { location.replace(mapped); }, 1600);

  // 用户手动点击时取消自动跳转（如点"重试"则立刻走其 href）
  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("a")) clearTimeout(t);
  });
  window.addEventListener("pagehide", function () { clearTimeout(t); });
})();
</script>
</body>
</html>
