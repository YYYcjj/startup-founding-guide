<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05070b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f9fc" media="(prefers-color-scheme: light)">
<title>地址不存在 · 年轻创业者行动指南</title>
<style>
  :root {
    --bg: #05070b; --panel: #0b1118; --border: #17202c; --border-2: #24313f;
    --text: #e2ecf7; --text-2: #8fa2b8; --text-3: #5b6a7c;
    --neon: #22d3ee; --neon-2: #7c6cff; --neon-3: #34f5c5;
    --glow: rgba(34, 211, 238, .38); --glow-2: rgba(124, 108, 255, .34);
    --grid: rgba(120, 190, 255, .045);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f9fc; --panel: #ffffff; --border: #dde5ee; --border-2: #c6d2e0;
      --text: #071018; --text-2: #55677d; --text-3: #8296ab;
      --neon: #0891b2; --neon-2: #6d4aff; --neon-3: #0d9488;
      --glow: rgba(8, 145, 178, .22); --glow-2: rgba(109, 74, 255, .18);
      --grid: rgba(20, 90, 150, .05);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    color: var(--text);
    background-color: var(--bg);
    background-image:
      radial-gradient(720px 380px at 12% -8%, rgba(34, 211, 238, .10), transparent 62%),
      radial-gradient(680px 360px at 88% -6%, rgba(124, 108, 255, .10), transparent 62%),
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 34px 34px, 34px 34px;
    font: 14.5px/1.78 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 540px;
    border: 1px solid var(--border); border-radius: 4px;
    background:
      linear-gradient(180deg, color-mix(in srgb, var(--neon) 5%, transparent), transparent 60%),
      color-mix(in srgb, var(--panel) 82%, transparent);
    padding: 36px 32px 28px;
    box-shadow: 0 0 0 1px rgba(34, 211, 238, .08), 0 30px 80px rgba(0, 0, 0, .55), 0 0 70px -28px var(--glow);
  }
  .code {
    font-family: var(--mono); font-size: 56px; line-height: 1; font-weight: 300; letter-spacing: .06em;
    background: linear-gradient(90deg, var(--neon), var(--neon-2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: var(--neon);
    filter: drop-shadow(0 0 20px var(--glow));
  }
  .bar {
    width: 40px; height: 2px; margin: 18px 0 20px;
    background: linear-gradient(90deg, var(--neon), var(--neon-2));
    box-shadow: 0 0 12px var(--glow);
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 10px; letter-spacing: -.1px; }
  p { margin: 0 0 10px; color: var(--text-2); font-size: 13.5px; }
  .path {
    font-family: var(--mono); font-size: 12px; color: var(--text-3);
    background: #0a1017; border: 1px solid var(--border); border-radius: 3px;
    padding: 8px 11px; margin: 15px 0 17px; word-break: break-all;
  }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  a.btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 15px; border-radius: 3px; text-decoration: none;
    border: 1px solid var(--border); color: var(--text-2);
    font-family: var(--mono); font-size: 12.5px;
    transition: border-color .16s, color .16s, box-shadow .16s;
  }
  a.btn:hover { border-color: var(--neon); color: var(--neon); box-shadow: 0 0 18px -6px var(--glow); }
  a.btn.primary { border-color: var(--neon); color: var(--neon); }
  .tip {
    font-family: var(--mono); font-size: 11.5px; color: var(--text-3);
    margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border); line-height: 1.9;
  }
  .tip code {
    font-family: var(--mono); color: var(--neon-3);
    background: #0a1017; border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <div class="bar"></div>
    <h1>这个地址没有对应的文档</h1>
    <p id="lead">站点里没找到这个位置，正在把你送回首页…</p>
    <div class="path" id="pathBox"></div>
    <div class="acts">
      <a class="btn primary" id="goHome" href="./">返回首页</a>
      <a class="btn" id="goRetry" href="./" style="display:none">按此路径再试一次</a>
    </div>
    <div class="tip">正确入口：yyycjj.github.io/startup-founding-guide/<br>文档地址都带 <code>#/</code> 前缀，例如 <code>#/公司/03-注册清单.md</code></div>
  </div>

<script>
(function () {
  "use strict";
  var BASE = "/startup-founding-guide/";
  var p = location.pathname || "";
  if (p.indexOf(BASE) === 0) p = p.slice(BASE.length);
  p = p.replace(/^\/+/, "");

  var pathBox = document.getElementById("pathBox");
  var goRetry = document.getElementById("goRetry");

  var shown = p;
  try { shown = decodeURIComponent(p); } catch (e) {}
  pathBox.textContent = p ? "你访问的路径：" + shown : "你访问的是站点根目录的上级地址";

  // 只有看起来像文档路径（以 .md 结尾）才映射成站内路由重试，否则直接回首页
  var mapped = /\.md$/i.test(p) ? BASE + "#/" + p : BASE;
  if (/\.md$/i.test(p)) {
    goRetry.href = mapped;
    goRetry.style.display = "";
  }

  var t = setTimeout(function () { location.replace(mapped); }, 1600);

  // 用户手动点击时取消自动跳转
  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("a")) clearTimeout(t);
  });
  window.addEventListener("pagehide", function () { clearTimeout(t); });
})();
</script>
</body>
</html>
